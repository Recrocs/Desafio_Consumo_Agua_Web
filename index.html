<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beba Água</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="splashScreen" class="screen splash-screen">

        <div class="welcome">

            <div class="water-icon">
                💧
            </div>

            <h1>Beba Água</h1>

            <p>
                Controle seu consumo de água.
            </p>

            <div class="theme-control">

                <span>Tema escuro</span>

                <label class="switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>

            </div>

            <button
                id="enterButton"
                class="primary-button"
            >
                Entrar
            </button>

        </div>

    </section>

    <section id="homeScreen" class="screen home-screen hidden">

        <header class="header">

            <button
                id="backButton"
                class="back-button"
            >
                ←
            </button>

            <h1>Beba Água</h1>

        </header>


        <main class="container">

            <section class="goal">

                <p>Minha meta diária</p>

                <strong id="dailyGoal">
                    0 ml
                </strong>

            </section>

            <section class="today">

                <div>

                    <p>Consumido hoje</p>

                    <strong id="totalToday">
                        0 ml
                    </strong>

                </div>

                <div class="percentage">

                    <strong id="percentage">
                        0%
                    </strong>

                    <span>
                        da meta
                    </span>

                </div>

            </section>


            <!-- BARRA -->

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                    style="width: 0%"
                ></div>

            </div>

            <section class="records">

                <div class="records-header">

                    <h2>Registros</h2>

                    <span id="recordCount">
                        0 registros
                    </span>

                </div>


                <div
                    id="recordsContainer"
                    class="records-container"
                ></div>


                <div
                    id="emptyState"
                    class="empty-state"
                >

                    <div>
                        💧
                    </div>

                    <h3>
                        Nenhum registro
                    </h3>

                    <p>
                        Adicione seu primeiro consumo.
                    </p>

                </div>

            </section>

            <button
                id="addButton"
                class="add-button"
            >
                + Adicionar consumo
            </button>

        </main>

    </section>

    <div
        id="modalOverlay"
        class="modal-overlay hidden"
    >

        <div class="modal">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Adicionar consumo
                </h2>

                <button
                    id="closeModal"
                    class="close-button"
                >
                    ×
                </button>

            </div>


            <form id="waterForm">

                <input
                    type="hidden"
                    id="recordId"
                >


                <div class="form-group">

                    <label for="recordDate">
                        Data
                    </label>

                    <input
                        type="date"
                        id="recordDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="quantity">
                        Quantidade de água (ml)
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        min="1"
                        step="1"
                        placeholder="Ex.: 500"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="weight">
                        Peso atual (kg)
                    </label>

                    <input
                        type="number"
                        id="weight"
                        min="1"
                        step="0.1"
                        placeholder="Ex.: 70"
                        required
                    >

                </div>


                <div class="goal-preview">

                    <span>
                        Meta diária estimada
                    </span>

                    <strong id="modalGoal">
                        0 ml
                    </strong>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelButton"
                        class="secondary-button"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Salvar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
